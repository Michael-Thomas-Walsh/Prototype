services:
  graph:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${FUSION_NEO4J_PASSWORD:?Set FUSION_NEO4J_PASSWORD before starting the graph}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - fusion_graph_data:/data
volumes:
  fusion_graph_data:
